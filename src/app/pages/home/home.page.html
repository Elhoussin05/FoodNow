<ion-header>
  <ion-toolbar>
    <ion-title>FoodNow</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>Restaurants a prop</h1>

  <ion-searchbar
    [(ngModel)]="searchText"
    placeholder="Buscar restaurant">
  </ion-searchbar>

  <ion-list class="ion-margin-top">

     @for(restaurant of restaurants;track restaurant.id){

      <ion-item>
        <ion-label>
          <p>{{restaurant.name}} - {{restaurant.cuisine}} - {{restaurant.rating}} - {{restaurant.deliveryTime}} 
            <ion-img src= {{restaurant.image}}></ion-img>
          </p>
        </ion-label>

      </ion-item>
     }@empty{

      <ion-text color="medium">
          <p>Encara no hi ha cap restaurant a la llista.</p>
      </ion-text>

     }

  </ion-list>

  <h3>Numero de Restaurants : {{restaurants.length}}</h3>

  <!-- KATA: ací van la cerca, el recompte, la llista i l'estat buit -->
  
</ion-content>
